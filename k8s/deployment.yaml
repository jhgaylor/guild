apiVersion: apps/v1
kind: Deployment
metadata:
  name: guild
  namespace: guild
  labels:
    app: guild
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guild
  template:
    metadata:
      labels:
        app: guild
    spec:
      containers:
        - name: guild
          # `:latest` is mutable — the build workflow rebuilds on every
          # push to main. Always forces a manifest check on pod start so
          # `kubectl rollout restart deployment/guild` actually picks up
          # the new digest. Swap to a pinned tag once releases land.
          image: ghcr.io/jhgaylor/guild:latest
          imagePullPolicy: Always
          env:
            # CNPG auto-generates the `guild-pg-app` Secret on Cluster
            # bootstrap. `uri` is the postgres://user:pass@host:port/db
            # URL that Ecto/Phoenix consume directly via DATABASE_URL.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: guild-pg-app
                  key: uri
            # Phoenix release env. PHX_SERVER=true makes the release
            # actually start the endpoint; the Dockerfile sets the same
            # values but Kubernetes-level env is explicit for operators
            # reading kubectl describe.
            - name: PHX_SERVER
              value: "true"
            - name: PORT
              value: "4000"
            - name: PHX_HOST
              value: guild.inevitable.fyi
            # TODO(secret-key-base): wire from a real Secret before any
            # session/cookie use. The Dockerfile auto-generates one at
            # container start when unset — acceptable for single-replica
            # Wedge B with no logged-in users.
          envFrom:
            - secretRef:
                name: guild-app-secrets
          ports:
            - containerPort: 4000
          readinessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
