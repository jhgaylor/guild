apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: guild
  namespace: guild
  labels:
    app: guild
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`guild.inevitable.fyi`)"
      kind: Rule
      services:
        - name: guild
          port: 80
  tls:
    secretName: guild-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: guild-http
  namespace: guild
  labels:
    app: guild
spec:
  entryPoints:
    - web
  routes:
    - match: "Host(`guild.inevitable.fyi`)"
      kind: Rule
      middlewares:
        # redirect-https lives in the default namespace; cross-namespace
        # refs need the namespace qualifier.
        - name: redirect-https
          namespace: default
      services:
        - name: guild
          port: 80
