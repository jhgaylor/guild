# TEMPLATE ONLY — not applied via Flux (see kustomization.yaml).
# Create the real Secret out of band:
#   kubectl create secret generic guild-app-secrets -n guild \
#     --from-literal=GITHUB_APP_ID=... --from-literal=GITHUB_PRIVATE_KEY=... \
#     ...
# This file documents the expected key set; placeholder values below.
apiVersion: v1
kind: Secret
metadata:
  name: guild-app-secrets
  namespace: guild
type: Opaque
data:
  # Operator: fill these via Infisical or: kubectl create secret generic guild-app-secrets --from-literal=KEY=VALUE
  # Values below are placeholders (base64 of "changeme").
  # Live cluster Secret needs SECRET_KEY_BASE, OPERATOR_USERNAME, and OPERATOR_PASSWORD
  # provisioned out-of-band (Infisical/kubectl) before deploying.
  GITHUB_APP_ID: Y2hhbmdlbWU=
  GITHUB_PRIVATE_KEY: Y2hhbmdlbWU=
  GITHUB_INSTALLATION_ID: Y2hhbmdlbWU=
  GITHUB_WEBHOOK_SECRET: Y2hhbmdlbWU=
  FOUNTAIN_BASE_URL: Y2hhbmdlbWU=
  FOUNTAIN_API_KEY: Y2hhbmdlbWU=
  GUILD_IMPLEMENTER_AGENT_ID: Y2hhbmdlbWU=
  GUILD_WORKER_VAULT_ID: Y2hhbmdlbWU=
  SECRET_KEY_BASE: Y2hhbmdlbWU=
  OPERATOR_USERNAME: Y2hhbmdlbWU=
  OPERATOR_PASSWORD: Y2hhbmdlbWU=
  # Slack — provisioned out-of-band (Infisical/kubectl)
  SLACK_BOT_TOKEN: Y2hhbmdlbWU=
  SLACK_CHANNEL_ID: Y2hhbmdlbWU=
  # Required for /guild slash commands (POST /slack/commands). Without this all
  # inbound Slack commands are rejected 403.
  SLACK_SIGNING_SECRET: Y2hhbmdlbWU=
  # Linear — provisioned out-of-band (Infisical/kubectl)
  LINEAR_API_KEY: Y2hhbmdlbWU=
  LINEAR_TEAM_ID: Y2hhbmdlbWU=
  # team-specific Linear workflow state UUIDs
  LINEAR_STATE_IN_PROGRESS_ID: Y2hhbmdlbWU=
  LINEAR_STATE_DONE_ID: Y2hhbmdlbWU=
